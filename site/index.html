<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Olho de Deus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#03060c">
<meta name="description" content="Globo de satélite com câmeras públicas do mundo inteiro, sismos, eventos naturais, ISS, clima, notícias e voos, tudo com dados abertos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%2303060c' stroke='%2335e0d6' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2335e0d6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* =======================================================================
   OLHO DE DEUS v3 — globo de satélite com câmeras públicas e dados abertos
   Layout: globo em tela cheia + HUD de vidro escuro. Esquerda: camadas e
   filtros. Direita: dossiê do item selecionado + listas. Rodapé: saúde de
   cada fonte. Celular: barra inferior que abre folhas (bottom sheets).
   Tema único escuro, de propósito (sala de comando).
   ======================================================================= */
:root {
  --bg: #03060c;
  --glass: rgba(8, 15, 28, .82);
  --glass-hi: rgba(12, 22, 40, .96);
  --line: #1a2f4d;
  --line-hi: #2b4c76;
  --fg: #dbe7f7;
  --muted: #8aa0c0;
  --dim: #556d8d;
  --accent: #35e0d6;
  --accent-dim: #0f3d3a;
  --warn: #ffb020;
  --crit: #ff4d5e;
  --ok: #43d17a;
  --iss: #a99cff;
  --news: #4db6ff;
  --flight: #ffe08a;
  --sun: #ffc24a;
  --f-disp: "Chakra Petch", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 12px;
  --dock-w: 256px;
  --side-w: 340px;
  --top-h: 62px;
  --foot-h: 40px;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --sheet-h: min(58vh, 560px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 13px/1.4 var(--f-body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-disp); }
kbd, .kbd { font: 500 10px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; background: rgba(3, 6, 12, .4); }

/* ---------- céu, globo e vinheta ---------- */
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(110% 85% at 50% 42%, #08142a 0%, #050b18 45%, var(--bg) 78%); }
#stars { width: 100%; height: 100%; display: block; }
#globe { position: fixed; inset: 0; z-index: 1; touch-action: none; }
#globe canvas { display: block; outline: none; }
#vignette { position: fixed; inset: 0; z-index: 2; pointer-events: none;
  background: radial-gradient(130% 100% at 50% 46%, transparent 56%, rgba(1, 3, 8, .62) 100%); }

/* dicas ao passar o mouse (as do globe.gl e a nossa) */
.float-tooltip-kap, .tip {
  background: var(--glass-hi) !important; color: var(--fg) !important;
  border: 1px solid var(--line-hi); border-radius: 8px !important;
  padding: 7px 9px !important; font: 12px/1.35 var(--f-body) !important;
  box-shadow: 0 8px 26px rgba(0, 0, 0, .5); max-width: 260px !important;
}
.tip { position: fixed; z-index: 40; pointer-events: none; transform: translate(14px, 14px); }
.tip.flip { transform: translate(calc(-100% - 14px), 14px); }
.tt-k { display: block; margin-bottom: 2px; font: 500 9.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* marcadores HTML presos ao globo */
.mk-iss { pointer-events: auto; position: relative; display: grid; place-items: center; width: 30px; height: 30px; color: var(--iss); cursor: pointer; }
.mk-iss svg { width: 26px; height: 26px; filter: drop-shadow(0 0 6px rgba(169, 156, 255, .95)); }
.mk-iss span { position: absolute; left: 26px; top: -2px; font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--iss); text-shadow: 0 0 6px #000, 0 0 2px #000; white-space: nowrap; }
.mk-sel { pointer-events: none; position: relative; width: 26px; height: 26px; border-radius: 50%;
  border: 1.5px solid var(--accent); box-shadow: 0 0 10px rgba(53, 224, 214, .55), inset 0 0 6px rgba(53, 224, 214, .3); }
.mk-sel i { position: absolute; background: var(--accent); }
.mk-sel i:nth-child(1), .mk-sel i:nth-child(2) { left: 50%; width: 1.5px; height: 7px; margin-left: -.75px; }
.mk-sel i:nth-child(1) { top: -9px; } .mk-sel i:nth-child(2) { bottom: -9px; }
.mk-sel i:nth-child(3), .mk-sel i:nth-child(4) { top: 50%; height: 1.5px; width: 7px; margin-top: -.75px; }
.mk-sel i:nth-child(3) { left: -9px; } .mk-sel i:nth-child(4) { right: -9px; }
.mk-sun { pointer-events: auto; width: 18px; height: 18px; border-radius: 50%; cursor: help;
  background: radial-gradient(circle, #fff6d6 0 28%, var(--sun) 30% 52%, rgba(255, 194, 74, 0) 56%);
  box-shadow: 0 0 22px 8px rgba(255, 194, 74, .35); }

/* ======== CABEÇALHO ======== */
.top {
  position: fixed; z-index: 20; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 16px;
  padding: calc(var(--safe-t) + 10px) 16px 10px;
  background: linear-gradient(180deg, rgba(3, 6, 12, .96), rgba(3, 6, 12, .55) 62%, transparent);
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.eye { width: 30px; height: 30px; position: relative; flex: 0 0 auto; }
.eye::before, .eye::after { content: ""; position: absolute; border-radius: 50%; }
.eye::before { inset: 0; border: 1.5px solid var(--accent); box-shadow: 0 0 12px rgba(53, 224, 214, .35), inset 0 0 8px rgba(53, 224, 214, .25); }
.eye::after { inset: 9px; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pupil 3.2s ease-in-out infinite; }
@keyframes pupil { 0%, 100% { opacity: .55; transform: scale(.78); } 50% { opacity: 1; transform: scale(1); } }
.title h1 { margin: 0; font: 600 17px/1 var(--f-disp); letter-spacing: .16em; }
.title .sub { margin-top: 4px; font-size: 10px; color: var(--muted); letter-spacing: .24em; text-transform: uppercase; }

.search { position: relative; flex: 0 1 320px; min-width: 0; height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 9px; }
.search:focus-within { border-color: var(--accent); }
.search > svg { flex: 0 0 auto; color: var(--muted); }
.search input { flex: 1 1 auto; min-width: 0; height: 100%; background: transparent; border: 0; outline: none; font: 13px var(--f-mono); }
.search input::placeholder { color: var(--dim); }
.search input::-webkit-search-cancel-button { filter: invert(.6); }
.locbtn { flex: 0 0 auto; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); }
.locbtn:hover { color: var(--accent); background: rgba(53, 224, 214, .1); }
.locbtn.busy svg { animation: spin 1.2s linear infinite; color: var(--warn); }
.sugg { position: absolute; z-index: 30; left: -1px; right: -1px; top: calc(100% + 6px); margin: 0; padding: 4px; list-style: none;
  background: var(--glass-hi); border: 1px solid var(--line-hi); border-radius: 10px; box-shadow: 0 14px 40px rgba(0, 0, 0, .55); }
.sugg li { display: flex; flex-direction: column; gap: 1px; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
.sugg li[aria-selected="true"], .sugg li:hover { background: rgba(53, 224, 214, .12); }
.sugg b { font-weight: 500; font-size: 13px; }
.sugg small { color: var(--muted); font-size: 11px; }
.sugg li.empty { color: var(--muted); cursor: default; background: none; }

.ticker { flex: 1 1 auto; min-width: 0; display: flex; justify-content: center; gap: 8px; }
.tchip { display: inline-flex; align-items: center; gap: 7px; min-width: 0; max-width: 340px; height: 30px; padding: 0 11px;
  background: var(--glass); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; white-space: nowrap; }
.tchip:hover { border-color: var(--line-hi); }
.tchip i { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
.tchip b { font-weight: 600; }
.tchip span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tchip em { font-style: normal; color: var(--muted); font-size: 11px; }
.clock { margin-left: auto; flex: 0 0 auto; text-align: right; line-height: 1.15; }
.clock .utc { font-size: 15px; color: var(--accent); letter-spacing: .04em; }
.clock .lbl { font-size: 10px; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
.clock .lbl .mono { letter-spacing: 0; color: var(--fg); }

/* ======== PAINÉIS ======== */
.panel { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r);
  -webkit-backdrop-filter: blur(12px) saturate(125%); backdrop-filter: blur(12px) saturate(125%);
  box-shadow: 0 12px 40px rgba(0, 0, 0, .38); }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 9px; border-bottom: 1px solid var(--line); }
.k { font-size: 10.5px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }

/* camadas (esquerda) */
.dock { position: fixed; z-index: 15; left: 14px; width: var(--dock-w);
  top: calc(var(--safe-t) + var(--top-h) + 6px); bottom: calc(var(--safe-b) + var(--foot-h) + 8px);
  display: flex; flex-direction: column; pointer-events: none; }
.dock .panel { pointer-events: auto; max-height: 100%; overflow: auto; overscroll-behavior: contain; }
.layer { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; text-align: left; border-bottom: 1px solid rgba(26, 47, 77, .55); transition: background .15s; }
.layer:hover { background: rgba(22, 40, 68, .55); }
.layer .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; transition: opacity .2s; }
.layer[aria-pressed="false"] .dot { opacity: .3; box-shadow: none; }
.layer .nm { display: block; font-size: 12.5px; font-weight: 500; }
.layer .nm small { margin-left: 4px; font-size: 10.5px; font-weight: 400; color: var(--muted); }
.layer .ct { display: block; margin-top: 1px; font: 10.5px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.layer .ct.load { color: var(--warn); }
.layer .ct.err { color: var(--crit); }
.toggle { width: 30px; height: 17px; border-radius: 9px; background: #14243a; border: 1px solid var(--line); position: relative; transition: background .18s, border-color .18s; }
.toggle::after { content: ""; position: absolute; top: 1px; left: 1px; width: 13px; height: 13px; border-radius: 50%; background: var(--dim); transition: transform .18s, background .18s; }
.layer[aria-pressed="true"] .toggle { background: var(--accent-dim); border-color: var(--accent); }
.layer[aria-pressed="true"] .toggle::after { transform: translateX(13px); background: var(--accent); }
.opts { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 2px 12px 10px 32px; border-bottom: 1px solid rgba(26, 47, 77, .55); }
.opts .note { flex: 1 0 100%; margin: 2px 0 0; }
.chip { font: 500 10.5px var(--f-mono); padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); }
.chip:hover { border-color: var(--line-hi); color: var(--fg); }
.chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-dim); }
.chip .n { margin-left: 4px; opacity: .7; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 10px; flex: 1 0 100%; margin-top: 4px; font: 10.5px var(--f-mono); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 8px; height: 8px; border-radius: 50%; }
.topic-form { display: flex; gap: 5px; flex: 1 0 100%; margin-top: 2px; }
.topic-form .chip { flex: 0 0 auto; }
.mini-in { flex: 1 1 0; width: 0; min-width: 0; height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line); background: rgba(3, 6, 12, .5); font: 11px var(--f-mono); outline: none; }
.mini-in:focus { border-color: var(--accent); }
.net { display: flex; align-items: center; gap: 7px; flex: 1 0 100%; font-size: 11.5px; }
.net i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
.net[data-s="ok"] i { background: var(--ok); }
.net[data-s="loading"] i { background: var(--warn); }
.net[data-s="error"] i { background: var(--crit); }
.net .mono { margin-left: auto; color: var(--muted); font-size: 10.5px; }

/* coluna da direita: dossiê + listas */
.side { position: fixed; z-index: 15; right: 14px; width: var(--side-w);
  top: calc(var(--safe-t) + var(--top-h) + 6px); bottom: calc(var(--safe-b) + var(--foot-h) + 8px);
  display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.side > .panel { pointer-events: auto; }
.dossier { flex: 0 0 auto; max-height: 64%; overflow: auto; overscroll-behavior: contain; }
.feed { flex: 1 1 0; min-height: 150px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; flex: 0 0 auto; border-bottom: 1px solid var(--line); }
.tab { flex: 1; padding: 10px 4px 9px; border-bottom: 2px solid transparent; color: var(--muted); font-size: 11.5px; font-weight: 500; letter-spacing: .04em; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .n { font-size: 10.5px; opacity: .75; }
.feed-chips { display: flex; flex-wrap: wrap; flex: 0 0 auto; gap: 5px; padding: 8px 10px; border-bottom: 1px solid rgba(26, 47, 77, .55); }
.feed-body { flex: 1 1 auto; overflow: auto; overscroll-behavior: contain; }
.item { display: block; width: 100%; text-align: left; padding: 9px 12px; border-bottom: 1px solid rgba(26, 47, 77, .45); }
.item:hover { background: rgba(22, 40, 68, .55); }
.item.sel { background: rgba(53, 224, 214, .09); box-shadow: inset 2px 0 0 var(--accent); }
.item .r1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tag { flex: 0 0 auto; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; font: 500 9px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.item .when { min-width: 0; font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .mag { margin-left: auto; font: 600 13px var(--f-mono); }
.item .ttl { margin-top: 4px; font-size: 12.5px; line-height: 1.32; overflow-wrap: anywhere; }
.item .sub2 { margin-top: 2px; font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.empty { padding: 22px 16px; color: var(--muted); font-size: 12px; line-height: 1.55; text-align: center; }
.sec-h { padding: 12px 12px 6px; }
.dir { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; text-align: left; color: var(--fg); text-decoration: none; border-bottom: 1px solid rgba(26, 47, 77, .45); }
.dir:hover { background: rgba(22, 40, 68, .55); }
.dir .tx { min-width: 0; flex: 1 1 auto; }
.dir small { display: block; font-size: 10.5px; color: var(--muted); }
.dir > svg { flex: 0 0 auto; color: var(--muted); }
.dir .st { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: 0 0 auto; }
.dir[data-s="ok"] .st { background: var(--ok); }
.dir[data-s="loading"] .st { background: var(--warn); }
.dir[data-s="error"] .st { background: var(--crit); }
.note { font-size: 11.5px; line-height: 1.5; color: var(--muted); }
.pad { padding: 10px 12px; margin: 0; }
.src-row { display: grid; grid-template-columns: 8px minmax(0, 1fr); gap: 4px 10px; padding: 10px 12px; border-bottom: 1px solid rgba(26, 47, 77, .45); }
.src-row > i { width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--dim); }
.src-row[data-s="ok"] > i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.src-row[data-s="loading"] > i { background: var(--warn); }
.src-row[data-s="error"] > i { background: var(--crit); }
.src-row b { font-size: 12px; font-weight: 500; }
.src-row .note { font-size: 11px; }
.src-row .err { color: var(--crit); }
.keys { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px 10px; padding: 4px 12px 14px; font-size: 11.5px; color: var(--muted); }
.keys kbd { justify-self: start; }

/* dossiê */
.d-h { display: flex; align-items: flex-start; gap: 10px; padding: 12px 8px 6px 14px; }
.d-t { flex: 1 1 auto; min-width: 0; }
.d-t .tag { display: inline-block; margin-bottom: 6px; }
.dossier h2 { margin: 0; font: 600 16px/1.22 var(--f-disp); letter-spacing: .02em; text-wrap: balance; overflow-wrap: anywhere; }
.dossier .co { margin-top: 3px; font-size: 11.5px; color: var(--accent); overflow-wrap: anywhere; }
.x { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px; color: var(--muted); font-size: 15px; }
.x:hover { background: rgba(22, 40, 68, .7); color: var(--fg); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 5px 14px; margin: 0; padding: 6px 14px 10px; }
.kv dt { padding-top: 2px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.kv dd { margin: 0; text-align: right; font: 12px/1.35 var(--f-mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.d-sec { padding: 10px 14px 6px; border-top: 1px solid var(--line); }
.d-sec h3 { margin: 0 0 6px; font-size: 10.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.d-sec .kv { padding: 4px 0 6px; }
.load { color: var(--warn); }
.wx-now { display: flex; align-items: center; gap: 12px; margin: 2px 0 6px; }
.wx-now .t { font: 600 34px/1 var(--f-disp); }
.wx-now .w { font-size: 12.5px; line-height: 1.35; }
.wx-now small { font-size: 11px; color: var(--muted); }
.list { list-style: none; margin: 0 0 6px; padding: 0; }
.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 6px 0; border-bottom: 1px dashed rgba(42, 75, 118, .45); font-size: 12px; }
.list li:last-child { border-bottom: 0; }
.list .m { font: 11px var(--f-mono); color: var(--muted); }
.list a, .list button { color: var(--fg); text-decoration: none; text-align: left; }
.list a:hover, .list button:hover { color: var(--accent); text-decoration: underline; }
.badge { align-self: center; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; font: 500 9.5px var(--f-mono); white-space: nowrap; }
.links { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px 14px; border-top: 1px solid var(--line); }
.linkout { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--accent-dim); color: var(--accent); font-size: 11.5px; text-decoration: none; }
.linkout:hover { background: var(--accent-dim); }
.linkout[aria-pressed="true"] { background: var(--accent-dim); border-color: var(--accent); }
.cam-img { position: relative; margin: 0 14px 10px; aspect-ratio: 16 / 9; max-width: 100%; overflow: hidden; border-radius: 9px; border: 1px solid var(--line); background: #000; }
.cam-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam-img .stamp { position: absolute; left: 8px; bottom: 7px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, .66); font: 10.5px var(--f-mono); }
.cam-img .live { position: absolute; right: 8px; top: 7px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, .66); font: 600 9.5px var(--f-mono); letter-spacing: .1em; color: #ff9aa3; }
.cam-img .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--crit); animation: blink 1.4s infinite; }
.attr { padding: 0 14px 6px; margin: 0; font-size: 10.5px; }

/* ======== RODAPÉ DE STATUS ======== */
.status { position: fixed; z-index: 16; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 14px;
  padding: 8px 16px calc(var(--safe-b) + 8px); font-size: 11px; color: var(--muted);
  background: linear-gradient(0deg, rgba(3, 6, 12, .96), rgba(3, 6, 12, .45) 70%, transparent); pointer-events: none; }
.status > * { pointer-events: auto; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px 12px; min-width: 0; }
.src { display: inline-flex; align-items: center; gap: 6px; cursor: default; }
.src i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.src[data-s="ok"] i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.src[data-s="loading"] i { background: var(--warn); animation: blink 1s infinite; }
.src[data-s="error"] i { background: var(--crit); }
.src[data-s="off"] { opacity: .45; }
.upd { white-space: nowrap; }
.upd b { font-weight: 500; color: var(--fg); }
.fbtn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 7px; border: 1px solid var(--line); background: var(--glass); font: 500 11px var(--f-mono); letter-spacing: .04em; white-space: nowrap; }
.fbtn:hover { border-color: var(--accent); color: var(--accent); }
.fbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent-dim); }
#rotBtn { margin-left: auto; }
.fbtn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 50% { opacity: .3; } }

/* aviso e tela de carregamento */
.banner { position: fixed; z-index: 35; left: 50%; bottom: calc(var(--safe-b) + 54px); transform: translateX(-50%);
  width: min(560px, calc(100vw - 32px)); display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 10px 10px 14px; border-radius: 10px; border: 1px solid var(--warn); background: var(--glass-hi);
  color: #ffd27a; font-size: 12px; line-height: 1.5; box-shadow: 0 12px 34px rgba(0, 0, 0, .55); }
.banner p { margin: 0; flex: 1; }
.banner b { color: #ffe3a3; }
.banner button { padding: 0 4px; color: var(--muted); font-size: 14px; }
.boot { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 18px; padding: 24px;
  background: var(--bg); color: var(--muted); font-size: 13px; text-align: center; transition: opacity .6s; }
.boot.done { opacity: 0; pointer-events: none; }
.boot-eye { width: 64px; height: 64px; position: relative; }
.boot-eye::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent); box-shadow: 0 0 22px rgba(53, 224, 214, .4); }
.boot-eye::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 18px var(--accent); animation: pupil 1.6s ease-in-out infinite; }
.boot p { margin: 0; max-width: 440px; line-height: 1.55; }
.boot .err { color: #ffd27a; }

/* ======== CELULAR: barra inferior + folhas ======== */
.mbar { display: none; }
@media (max-width: 860px) {
  :root { --top-h: 100px; }
  .top { flex-wrap: wrap; gap: 8px 12px; padding: calc(var(--safe-t) + 8px) 12px 10px; }
  .title .sub { display: none; }
  .title h1 { font-size: 15px; }
  .search { order: 3; flex: 1 0 100%; height: 40px; }
  .search .kbd { display: none; }
  .ticker, .status { display: none; }
  .mbar { position: fixed; z-index: 25; left: 8px; right: 8px; bottom: calc(var(--safe-b) + 8px); display: flex; gap: 4px; padding: 4px;
    background: var(--glass-hi); border: 1px solid var(--line); border-radius: 14px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  .mbar button { flex: 1 1 0; min-width: 0; height: 44px; border-radius: 10px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
  .mbar button[aria-pressed="true"] { background: var(--accent-dim); color: var(--accent); }
  .mbar .n { display: block; font: 10px var(--f-mono); opacity: .8; }
  .dock, .side { left: 8px; right: 8px; width: auto; top: auto; bottom: calc(var(--safe-b) + 68px); }
  .dock { display: none; }
  .dock .panel { max-height: var(--sheet-h); }
  body.sheet-layers .dock { display: flex; }
  .side .feed { display: none; flex: 0 0 auto; height: var(--sheet-h); }
  body.sheet-events .side .feed, body.sheet-cams .side .feed, body.sheet-sources .side .feed { display: flex; }
  body.sheet-on .side .dossier { display: none; }
  .dossier { max-height: var(--sheet-h); }
  .feed .tabs { display: none; }
  .banner { bottom: calc(var(--safe-b) + 70px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #18293f; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

.mapsel { padding: 10px 12px 11px; border-bottom: 1px solid var(--line); }

.mchips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 14px 8px; }
.cam-page { margin: 0 14px 10px; padding: 14px; border: 1px dashed var(--line-hi); border-radius: 9px; text-align: center; }
.cam-page p { margin: 0 0 10px; }
.linkout.big { font-size: 13px; padding: 9px 14px; }
.ctag { display: inline-block; font: 500 9px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 0 5px; border: 1px solid currentColor; border-radius: 4px; margin-right: 5px; vertical-align: 1px; white-space: nowrap; }

.clist { list-style: none; margin: 0; padding: 0 12px 8px; }

.clist li:last-child { border-bottom: 0; }
.clist button { color: var(--fg); text-align: left; overflow-wrap: anywhere; }

.more { display: block; width: calc(100% - 24px); margin: 2px 12px 10px; padding: 7px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font-size: 11.5px; }

@media (max-width: 860px) {
  .attrib { left: 10px; right: 10px; bottom: calc(var(--safe-b) + 64px); font-size: 9.5px; }

}

    const j = JOBS[k];
    if (j.busy || !j.on()) continue;
    const st = S.src[SRC_OF[k] || k] || {};
    // erro de configuração (chave/endereço) não adianta repetir a cada minuto e meio
    const retry = st.kind === "auth" || st.kind === "config" || st.kind === "missing" ? 1800000 : 90000;
    const due = !j.last || (j.every && now - j.last >= j.every) || (st.status === "error" && now - j.last >= retry);
    if (due) runJob(k);
  }

const MEDIA = { timer: 0, hls: null, tok: 0 };
// o que dá para mostrar de cada câmera, na ordem de preferência
function camModes(i, row) {
  const out = [];
  if (row[3]) out.push({ k: "hls", label: "Vídeo ao vivo" });
  if (row[5]) out.push({ k: "emb", label: /youtube/.test(row[5]) ? "Vídeo (YouTube)" : "Player ao vivo" });
  if (row[2]) out.push({ k: "img", label: "Imagem atual" });
  if (row[4]) out.push({ k: "mp4", label: "Clipe de vídeo" });
  return out;
}
function stopMedia() {
  clearInterval(MEDIA.timer); MEDIA.timer = 0; MEDIA.tok++;
  if (MEDIA.hls) { try { MEDIA.hls.destroy(); } catch (e) { /* já destruído */ } MEDIA.hls = null; }
  const box = $("#camMedia");
  if (box) box.querySelectorAll("video, iframe").forEach((v) => { try { if (v.pause) v.pause(); v.removeAttribute("src"); if (v.load) v.load(); } catch (e) { /* ok */ } v.remove(); });
}
function mediaMsg(box, html) { box.innerHTML = '<div class="msg">' + html + "</div>"; }
function stampTxt() { return "recebida às " + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
async function startMedia(i, row, mode, tok) {
  stopMedia();
  const mt = MEDIA.tok, box = $("#camMedia");
  if (!box || !mode) return;
  const alive = () => mt === MEDIA.tok && tok === S.tok && document.body.contains(box);
  const src = camSrc(i), page = row[6] || src.home;
  const fail = (why) => {
    if (!alive()) return;
    const modes = camModes(i, row), next = modes.find((x) => x.k !== mode && !(S.sel.tried || []).includes(x.k));
    S.sel.tried = (S.sel.tried || []).concat(mode);
    if (next) { S.sel.mode = next.k; renderDossier(true); return; }
    mediaMsg(box, esc(why) + (page ? "<br>" + linkBtn(page, "Ver na fonte") : ""));
  };
  if (mode === "img") {
    let url = row[2];
    if (src.live === "sg") url = await sgImage(row[0]).catch(() => url);
    if (!alive()) return;
    box.innerHTML = '<img id="camImg" alt="Imagem atual da câmera ' + esc(row[1]) + '" referrerpolicy="no-referrer" decoding="async"><figcaption class="stamp" id="camStamp">carregando imagem…</figcaption><span class="live">AO VIVO</span>';
    const img = $("#camImg"), stamp = $("#camStamp");
    let plain = false, okOnce = false;
    const bust = () => (plain ? url : url + (url.indexOf("?") >= 0 ? "&" : "?") + "_olho=" + Math.floor(Date.now() / 30000));
    img.onload = () => { okOnce = true; if (stamp) stamp.textContent = stampTxt(); };
    img.onerror = () => {
      if (!alive()) return;
      if (!plain) { plain = true; img.src = bust(); return; } // alguns servidores recusam parâmetros extras
      if (!okOnce) fail("A imagem não carregou agora. A câmera pode estar fora do ar ou bloquear a exibição em outros sites.");
      else if (stamp) stamp.textContent = "sem imagem nova agora";
    };
    img.src = bust();
    MEDIA.timer = setInterval(() => { if (!alive()) return clearInterval(MEDIA.timer); if (!document.hidden) img.src = bust(); }, 60000);
  } else if (mode === "mp4") {
    box.innerHTML = '<video id="camVid" muted autoplay loop playsinline controls preload="auto"></video><span class="live still">CLIPE</span>';
    const v = $("#camVid");
    v.onerror = () => fail("O clipe de vídeo não carregou.");
    v.src = row[4];
  } else if (mode === "emb") {
    box.innerHTML = '<iframe title="Câmera ' + esc(row[1]) + '" src="' + esc(safeUrl(row[5])) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" loading="eager"></iframe>';
  } else if (mode === "hls") {
    box.innerHTML = '<video id="camVid" muted autoplay playsinline controls></video><span class="live">AO VIVO</span>';
    const v = $("#camVid"), url = row[3];
    let gaveUp = false;
    const giveUp = () => { if (!gaveUp) { gaveUp = true; fail("O vídeo ao vivo não abriu (a fonte pode estar fora do ar ou não permitir outros sites)."); } };
    const watchdog = setTimeout(() => { if (alive() && v.readyState < 2) giveUp(); }, 20000);
    v.addEventListener("playing", () => clearTimeout(watchdog), { once: true });
    if (v.canPlayType("application/vnd.apple.mpegurl")) { v.onerror = giveUp; v.src = url; v.play().catch(() => {}); return; }
    try { if (!window.Hls) await loadScript(LIBS.hls); } catch (e) { clearTimeout(watchdog); return giveUp(); }
    if (!alive()) return;
    if (!window.Hls || !window.Hls.isSupported()) { clearTimeout(watchdog); return giveUp(); }
    const h = new window.Hls({ maxBufferLength: 12, liveSyncDurationCount: 3, manifestLoadingMaxRetry: 2, levelLoadingMaxRetry: 2, fragLoadingMaxRetry: 2 });
    MEDIA.hls = h;
    h.on(window.Hls.Events.ERROR, (ev, data) => { if (data && data.fatal) { clearTimeout(watchdog); try { h.destroy(); } catch (e) { /* ok */ } if (MEDIA.hls === h) MEDIA.hls = null; giveUp(); } });
    h.loadSource(url);
    h.attachMedia(v);
    h.on(window.Hls.Events.MANIFEST_PARSED, () => { v.play().catch(() => {}); });
  }
}
function refreshCamMedia() {
  const img = $("#camImg");
  if (img && img.src) img.src = img.src.replace(/([?&]_olho=)\d+/, "$1" + Math.floor(Date.now() / 1000));
}
// Singapura: o endereço da foto é assinado e muda a cada minuto; pede o atual à API do governo
let sgCache = null;
async function sgImage(id) {
  if (!sgCache || Date.now() - sgCache.t > 50000) {
    const d = await getJSON(API.sgTraffic, { timeout: 10000 });
    const cams = (d.items && d.items[0] && d.items[0].cameras) || [];
    sgCache = { t: Date.now(), map: new Map(cams.map((c) => [String(c.camera_id), c.image])) };
  }
  const u = sgCache.map.get(String(id));
  if (!u) throw new Error("câmera fora da lista agora");
  return u;
}
async function startWindy(w, tok) {
  const img = $("#wImg"), stamp = $("#camStamp");
  if (!img) return;
  try { await windyFresh(w); } catch (e) { /* usa a imagem que já temos */ }
  if (tok !== S.tok) return;
  img.onerror = () => { if (stamp) stamp.textContent = "imagem indisponível agora"; };
  img.onload = () => { if (stamp) stamp.textContent = w.updated ? "imagem de " + ago(w.updated) : stampTxt(); };
  img.src = w.img;
}
async function fillWeather(ref, tok) {
  const box = $("#d-wx");
  try {
    const d = await getJSON(API.wx(ref.lat, ref.lng), { timeout: 12000 });
    if (tok !== S.tok) return;
    S.selOff = d.utc_offset_seconds; S.selTzName = d.timezone || ""; S.selTzApprox = false;
    if (box) box.innerHTML = wxHTML(d);
    setSrc("wx", "ok");
  } catch (e) {
    if (tok !== S.tok) return;
    S.selOff = Math.round(ref.lng / 15) * 3600; S.selTzApprox = true;
    if (box) box.innerHTML = '<h3>Clima agora</h3><p class="note">Clima indisponível: ' + esc(e.message) + ".</p>";
    setSrc("wx", "error", { err: e });
  }
  updatePlaceTime();
  fillPasses(ref, tok);
}
function wxHTML(d) {
  const c = d.current || {}, dl = d.daily || {};
  const hm = (s) => (s ? String(s).slice(11, 16) : "—");
  const max = dl.temperature_2m_max && dl.temperature_2m_max[0], min = dl.temperature_2m_min && dl.temperature_2m_min[0];
  const rain = dl.precipitation_probability_max && dl.precipitation_probability_max[0];
  return "<h3>Clima agora · Open-Meteo</h3>" +
    '<div class="wx-now"><span class="t">' + (isNum(c.temperature_2m) ? Math.round(c.temperature_2m) + "°" : "—") + '</span><span class="w">' +
    esc(WMO[c.weather_code] || "Condição sem código") + "<br><small>sensação " + (isNum(c.apparent_temperature) ? Math.round(c.apparent_temperature) + "°" : "—") +
    " · " + (c.is_day ? "de dia" : "de noite") + "</small></span></div>" +
    kv([
      ["Umidade", isNum(c.relative_humidity_2m) ? c.relative_humidity_2m + "%" : "—"],
      ["Vento", isNum(c.wind_speed_10m) ? Math.round(c.wind_speed_10m) + " km/h de " + compass(c.wind_direction_10m) + (isNum(c.wind_gusts_10m) ? " · rajadas " + Math.round(c.wind_gusts_10m) : "") : "—"],
      ["Nuvens", isNum(c.cloud_cover) ? c.cloud_cover + "%" : "—"],
      ["Chuva agora", isNum(c.precipitation) ? f1(c.precipitation) + " mm" : "—"],
      isNum(max) ? ["Hoje", "máx " + Math.round(max) + "° · mín " + Math.round(min) + "°" + (isNum(rain) ? " · chuva " + rain + "%" : "")] : null,
      dl.sunrise ? ["Sol", "nasce " + hm(dl.sunrise[0]) + " · põe " + hm(dl.sunset && dl.sunset[0])] : null,
    ]);
}
function updatePlaceTime() {
  if (!S.sel || S.sel.kind !== "place" || S.selOff == null) return;
  setText("pl-time", fmtAt(Date.now(), S.selOff, false) + " · " + offStr(S.selOff) + (S.selTzApprox ? " (estimada)" : S.selTzName ? " · " + S.selTzName : ""));
}
let lastRev = 0;
async function fillName(ref, tok) {
  const wait = Math.max(0, 1100 - (Date.now() - lastRev)); // Nominatim: no máximo 1 consulta por segundo
  if (wait) await sleep(wait);
  if (tok !== S.tok) return;
  lastRev = Date.now();
  try {
    const d = await getJSON(API.reverse(ref.lat, ref.lng), { timeout: 9000 });
    if (tok !== S.tok || !d || d.error) return;
    const a = d.address || {};
    const local = a.city || a.town || a.village || a.municipality || a.hamlet || a.suburb || a.county || a.state_district;
    const top = local || a.state || a.country;
    if (!top) return;
    setText("d-name", top);
    setText("d-sub", [local ? a.state : null, a.country].filter(Boolean).join(" · "));
    setText("pl-attr", "Nome do lugar: © colaboradores do OpenStreetMap (Nominatim).");
    setSrc("geo", "ok");
  } catch (e) { if (tok === S.tok) setSrc("geo", "error", { err: e }); }
}
function fillPasses(ref, tok) {
  const box = $("#d-pass");
  if (!box || tok !== S.tok) return;
  if (ISS.mode !== "sgp4") {
    box.innerHTML = '<h3>Passagens da ISS</h3><p class="note">' + (ISS.mode === "poll" ? "Previsão indisponível: faltam os dados orbitais (TLE)." : "Ainda carregando a órbita. Abra o ponto de novo em instantes.") + "</p>";
    return;
  }
  const list = issPasses(ref.lat, ref.lng, 36, 10) || [], off = S.selOff, now = Date.now();
  box.innerHTML = "<h3>Passagens da ISS · próximas 36 h</h3>" + (list.length
    ? '<ul class="list">' + list.map((p) => {
      const when = p.start <= now + 20000 ? "passando agora" : fmtAt(p.start, off);
      const tag = p.visible ? ["visível", C.ok] : p.lit ? ["céu claro", "var(--muted)"] : ["na sombra", "var(--muted)"];
      return "<li><span>" + esc(when) + (p.start > now + 20000 ? ' <span class="m">' + esc(untilTxt(p.start)) + "</span>" : "") +
        '<br><span class="m">máx ' + Math.round(p.maxEl) + "° · de " + compass(p.az0) + " para " + compass(p.az1) + " · " + Math.max(1, Math.round((p.end - p.start) / 60000)) + " min</span></span>" +
        '<span class="badge" style="color:' + tag[1] + '">' + tag[0] + "</span></li>";
    }).join("") + '</ul><p class="note">Horários na hora local do ponto. “Visível” quer dizer céu escuro e estação iluminada pelo Sol: dá para ver a olho nu.</p>'
    : '<p class="note">Nenhuma passagem acima de 10° de elevação nas próximas 36 h.</p>');
}
function setFollow(v) {
  ISS.follow = !!v;
  if (ISS.follow && ISS.pos) flyTo(ISS.pos.lat, ISS.pos.lng, Math.max(1.2, Math.min(2.2, globe ? globe.pointOfView().altitude : 2)), 800);
  applyRotate();
  if (S.sel && S.sel.kind === "iss") renderDossier(true);
  renderLayers();
}
async function copyText(t, btn) {
  let done = false;
  try { await navigator.clipboard.writeText(t); done = true; }
  catch (e) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { done = document.execCommand("copy"); } catch (e2) { done = false; }
    ta.remove();
  }
  if (btn) { const old = btn.textContent; btn.textContent = done ? "Copiado ✓" : "Selecione e copie: " + t; setTimeout(() => { btn.textContent = old; }, 2200); }
}

function layerStatus(k) {

    case "cams": return CAMS.state === "ok" ? [(CAMS.visCount !== CAMS.n ? f0(CAMS.visCount) + " de " : "") + f0(CAMS.n) + " câmeras · " + f0(camCountries()) + " países", ""] : ["aguardando…", ""];
    case "windy": return WINDY.key ? [s.updated ? f0(S.windy.length) + " no globo · " + (globe && globe.pointOfView().altitude >= 1.5 ? "aproxime para ver mais" : "região da tela") : "aguardando…", ""] : ["sem chave neste endereço", "err"];
    case "quakes": { const p = PERIODS.find((x) => x.id === S.period); return [f0(S.quakes.length) + " em " + (p ? p.label : "") + " · " + ago(s.updated), ""]; }

function renderLayers() {
  const box = $("#layers");
  if (!box) return;
  if (document.activeElement && document.activeElement.id === "topicIn") { updateLayerStatus(); return; } // não atrapalha quem está digitando
  let html = mapPanelHTML(), on = 0, total = 0;
  for (const L of LAYERS) {
    if (L.only && !L.only()) continue;
    total++;
    const isOn = !!S.layers[L.k];
    if (isOn) on++;
    const st = layerStatus(L.k);
    html += '<button class="layer" type="button" data-k="' + L.k + '" aria-pressed="' + isOn + '">' +
      '<span class="dot" style="color:' + L.color + '"></span>' +
      '<span><span class="nm">' + esc(L.nm) + (L.by ? "<small>" + esc(L.by) + "</small>" : "") + "</span>" +
      '<span class="ct ' + st[1] + '" data-ct="' + L.k + '">' + esc(st[0]) + "</span></span>" +
      '<span class="toggle" aria-hidden="true"></span></button>';
    const opts = isOn ? layerOptsHTML(L.k) : "";
    if (opts) html += '<div class="opts" data-opts="' + L.k + '">' + opts + "</div>";
  }
  setHTML(box, html);
  $("#layerCount").textContent = on + "/" + total;
}
function updateLayerStatus() {
  for (const L of LAYERS) {
    const el = document.querySelector('[data-ct="' + L.k + '"]');
    if (!el) continue;
    const st = layerStatus(L.k);
    el.textContent = st[0]; el.className = "ct " + st[1];
  }
}
function toggleLayer(k) {
  S.layers[k] = !S.layers[k];
  savePrefs();
  const on = S.layers[k];
  if (k === "grid") applyGrid();
  if (k === "night") { nightFade(); rebuildHtml(); }

  if (a === "topic") { S.topic = el.dataset.v; savePrefs(); renderLayers(); runJob("news", true); return; }
  if (a === "cams-on") { if (!S.layers.cams) toggleLayer("cams"); return; }
  if (a === "tab-cams") return openCamsTab();
  if (a === "basemap") { if (BASEMAP_BY[el.dataset.v] && S.basemap !== el.dataset.v) { S.basemap = el.dataset.v; savePrefs(); applyBasemap(); renderLayers(); renderFeed(); } return; }
  if (a === "labels" || a === "roads") { S[a] = !S[a]; savePrefs(); applyBasemap(); renderLayers(); return; }
  if (a === "camtype" || a === "camall" || a === "camvideo") {
    if (a === "camtype") { const k = el.dataset.v; S.camOff = S.camOff.includes(k) ? S.camOff.filter((x) => x !== k) : S.camOff.concat(k); }
    else if (a === "camall") S.camOff = S.camOff.length ? [] : CAMS.types.slice();
    else S.camVideo = !S.camVideo;
    savePrefs(); rebuildCamSets(); rebuildParticles(); renderLayers(); scheduleRegion(100);
    if (S.sel && S.sel.kind === "cam" && !CAMS.vis[S.sel.ref.i]) closeSel();
    return;
  }
  if (a === "fly-cc") {
    const v = countryView(+el.dataset.k);
    if (v) { if (NARROW.matches) setSheet(null); flyTo(v.lat, v.lng, v.alt, 1600); userInteract(); setTimeout(() => scheduleRegion(0), 1700); }
    return;
  }
  if (a === "all-cc") { S.allCc = !S.allCc; renderFeed(); return; }
  if (a === "types-open") { S.typesOpen = !S.typesOpen; renderLayers(); return; }
  if (a === "all-src") { S.allSrc = !S.allSrc; renderFeed(); return; }
  if (a === "cam-mode") { if (S.sel && S.sel.kind === "cam") { S.sel.mode = el.dataset.v; S.sel.tried = []; renderDossier(true); } return; }
  if (a === "windy-player") {
    const box = $("#camMedia"), w = S.sel && S.sel.ref;
    if (!box || !w || !w.player) return;
    const on = el.getAttribute("aria-pressed") !== "true";
    el.setAttribute("aria-pressed", String(on));
    if (on) {
      stopMedia();
      box.innerHTML = '<iframe title="Timelapse do dia: ' + esc(w.title) + '" src="' + esc(safeUrl(w.player)) + '" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    } else renderDossier(true);
  }
}
// Clique no globo sem passar pelo globe.gl (no mapa de ladrilhos a esfera fica escondida):
// se nenhum clique do globe.gl chegou logo depois, tratamos aqui.
function wireClickFallback(cv) {
  let down = null;
  cv.addEventListener("pointerdown", (e) => { down = { x: e.clientX, y: e.clientY, t: Date.now() }; }, { passive: true });
  cv.addEventListener("pointerup", (e) => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = Date.now() - down.t;
    down = null;
    if (moved > 6 || dt > 700 || e.button > 0) return;
    const at = Date.now(), ev = { clientX: e.clientX, clientY: e.clientY };
    setTimeout(() => { if ((S.clickAt || 0) < at - 5) onGlobeClick(null, ev, e.pointerType === "mouse" ? 13 : 22); }, 90);
  }, { passive: true });
}
function wire() {
  $("#layers").addEventListener("click", (e) => {
    const a = e.target.closest("[data-act]");
    if (a) return act(a);
    const l = e.target.closest(".layer[data-k]");
    if (l) toggleLayer(l.dataset.k);
  });
  $("#layers").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#topicIn"), v = (inp ? inp.value : "").trim();
    if (v.length < 3) { if (inp) { inp.value = ""; inp.placeholder = "use 3 letras ou mais"; } return; }
    S.topic = "custom"; S.topicCustom = v; savePrefs();
    if (inp) inp.blur();
    renderLayers(); runJob("news", true);
  });
  $("#feedBody").addEventListener("click", (e) => {
    const it = e.target.closest(".item[data-i]");
    if (it) { const f = FEED[+it.dataset.i]; if (f) select(f.kind, f.ref); return; }
    const a = e.target.closest("[data-act]");
    if (a) act(a);
  });
  $("#feedChips").addEventListener("click", (e) => {
    const c = e.target.closest("[data-filter]");
    if (c) { S.filter = c.dataset.filter; renderFeed(); $("#feedBody").scrollTop = 0; }
  });
  document.querySelectorAll(".tab").forEach((t) => t.addEventListener("click", () => { S.tab = t.dataset.tab; renderFeed(); $("#feedBody").scrollTop = 0; if (S.tab === "cams") scheduleRegion(0); }));
  $("#dossier").addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) act(a); });
  $("#ticker").addEventListener("click", (e) => { const a = e.target.closest("[data-act]"); if (a) act(a); });
  $("#mbar").addEventListener("click", (e) => { const b = e.target.closest("[data-sheet]"); if (b) setSheet(b.dataset.sheet); });
  $("#refresh").addEventListener("click", refreshAll);
  $("#rotBtn").addEventListener("click", () => { S.rotate = !S.rotate; savePrefs(); applyRotate(); renderFooter(); });
  // minha localização (só com permissão do navegador; nada é guardado)
  $("#locBtn").addEventListener("click", () => {
    const btn = $("#locBtn");
    if (!navigator.geolocation) { showBanner("Este navegador não informa a localização."); return; }
    btn.classList.add("busy");
    navigator.geolocation.getCurrentPosition(
      (pos) => { btn.classList.remove("busy"); selectPlace(pos.coords.latitude, pos.coords.longitude, { mine: true }, true); },
      (err) => { btn.classList.remove("busy"); showBanner("Não deu para obter sua localização: " + (err && err.code === 1 ? "o navegador não deu permissão." : "tente de novo em instantes.")); },
      { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
  });
  // busca
  const input = $("#q");
  input.addEventListener("input", () => {
    clearTimeout(Q.timer);
    const v = input.value.trim();
    if (v.length < 2 || parseCoords(v)) { Q.list = []; hideSugg(); return; }
    Q.timer = setTimeout(() => suggest(v), 260);
  });
  input.addEventListener("keydown", (e) => {
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && Q.list.length) {
      e.preventDefault();
      Q.idx = (Q.idx + (e.key === "ArrowDown" ? 1 : -1) + Q.list.length) % Q.list.length;
      paintSugg(input.value.trim());
    } else if (e.key === "Enter") { e.preventDefault(); submitSearch(); }
    else if (e.key === "Escape") { if (!$("#sugg").hidden) hideSugg(); else input.blur(); e.stopPropagation(); }
  });
  input.addEventListener("blur", () => setTimeout(hideSugg, 160));
  $("#sugg").addEventListener("mousedown", (e) => { const li = e.target.closest("li[data-i]"); if (li) { e.preventDefault(); pickSugg(+li.dataset.i); } });
  // teclado
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "Escape") { if (S.sel) closeSel(); else if (S.sheet) setSheet(null); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); input.focus(); input.select(); }
    else if (e.key === "r" || e.key === "R") refreshAll();
    else if (e.key === "g" || e.key === "G") { S.rotate = !S.rotate; savePrefs(); applyRotate(); renderFooter(); }
    else if ((e.key === "i" || e.key === "I") && ISS.pos) select("iss", ISS);
    else if (e.key === "m" || e.key === "M") {
      const i = BASEMAPS.findIndex((b) => b.id === S.basemap);
      S.basemap = BASEMAPS[(i + 1) % BASEMAPS.length].id; savePrefs(); applyBasemap(); renderLayers();
    }
  });
  document.addEventListener("visibilitychange", () => {
    if (!globe) return;
    if (document.hidden) globe.pauseAnimation();
    else { globe.resumeAnimation(); issTick(true); scheduler(); }
  });
  let rz = 0;
  window.addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => { if (globe) globe.width(innerWidth).height(innerHeight); drawStars(); layoutOffset(); }, 120);
  });
  const onNarrow = () => { setSheet(null); layoutOffset(); };
  if (NARROW.addEventListener) NARROW.addEventListener("change", onNarrow); else if (NARROW.addListener) NARROW.addListener(onNarrow);
}
function tickClock() {
  const now = new Date();
  $("#utc").textContent = now.toISOString().slice(11, 19);
  $("#lt").textContent = pad(now.getHours()) + ":" + pad(now.getMinutes());
  if (now.getSeconds() % 30 === 0) {
    updatePlaceTime();
    document.querySelectorAll(".when[data-t]").forEach((el) => { const t = +el.dataset.t; if (t) el.textContent = ago(t); });
    updateLayerStatus();
  }
}
function showBanner(html) {
  const b = $("#banner");
  b.innerHTML = "<p>" + html + '</p><button type="button" aria-label="Fechar aviso">✕</button>';
  b.querySelector("button").onclick = () => { b.hidden = true; };
  b.hidden = false;
}
function checkOffline() {
  const q = S.src.quakes || {}, e = S.src.events || {};
  if (q.status === "error" && e.status === "error" && q.kind === "network" && e.kind === "network") {
    showBanner("<b>Sem acesso às fontes de dados.</b> Confira a internet. Se esta tela está aberta dentro de uma prévia que bloqueia conexões externas, é normal: " +
      "abra o site publicado (endereço no LEIA-ME).");
    renderFeed();
  }
}
function bootFail(err) {
  console.error("[olho]", err);
  let webgl = false;
  try { const c = document.createElement("canvas"); webgl = !!(c.getContext("webgl2") || c.getContext("webgl")); } catch (e) { webgl = false; }
  const msg = $("#bootMsg");
  msg.innerHTML = webgl
    ? '<span class="err">Não consegui carregar o motor 3D do globo.</span><br>Confira a conexão com a internet e tente de novo.'
    : '<span class="err">Este navegador não liberou gráficos 3D (WebGL).</span><br>Tente o Chrome, o Edge ou o Firefox atualizados, com a aceleração de hardware ligada.';
  const b = document.createElement("button");
  b.className = "fbtn"; b.type = "button"; b.textContent = "Tentar de novo";
  b.onclick = () => location.reload();
  $("#boot").appendChild(b);
}
async function boot() {
  drawStars(); wire(); setupSW(); renderLayers(); renderFeed(); renderFooter(); tickClock();
  setInterval(tickClock, 1000);
  const satP = loadScript(LIBS.sat).then(() => !!window.satellite, () => false);
  try {
    await loadScript(LIBS.globe);
    if (typeof window.Globe !== "function") throw new Error("globe.gl não definiu Globe");
    initGlobe();
  } catch (e) { return bootFail(e); }
  wireClickFallback(globe.renderer().domElement);
  const bootEl = $("#boot");
  bootEl.classList.add("done");
  setTimeout(() => bootEl.remove(), 700);
  satP.then((ok) => { S.satLib = ok; if (!ok) ISS.mode = "poll"; scheduler(); });
  scheduler();
  setInterval(scheduler, 2500);
  setInterval(issTick, 500);
  setInterval(() => { if (!document.hidden) { computeOrbit(); updateSun(); if (S.basemap === "gibs") applyBasemap(); } }, 60000);
  const h = parseCoords(decodeURIComponent(location.hash.slice(1)));
  if (h) selectPlace(h[0], h[1], {}, true);
  setTimeout(checkOffline, 9000);
  // gancho de depuração: abra com ?debug no fim do endereço
  if (/[?&]debug\b/.test(location.search)) window.__olho = { S, ISS, CAMS, GRID, SW, select, selectPlace, pickAt, screenToGlobe, camRef, applyBasemap, flyTo, stopInertia, globe: () => globe, engine: () => ENGINE };
}
boot();
})();
